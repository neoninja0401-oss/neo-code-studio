
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neo Code Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111827;color:#f9fafb;font-family:Arial,sans-serif}
header{padding:18px;background:#1f2937;color:#60a5fa;font-size:23px;font-weight:bold}
.tabs{display:flex;gap:8px;padding:12px;flex-wrap:wrap}
.tabs button, #run{padding:10px 16px;border:0;border-radius:7px;cursor:pointer}
.tabs button{background:#374151;color:white}
.tabs button.active{background:#2563eb}
textarea{display:block;width:100%;height:230px;padding:14px;background:#0b1020;color:#86efac;border:1px solid #374151;font:15px monospace;resize:vertical}
#run{margin:12px;background:#16a34a;color:white;font-size:16px}
h3{margin:14px 12px}
iframe{width:calc(100% - 24px);height:250px;margin:0 12px 20px;background:white;border:0;border-radius:6px}
  
/* Mobile-friendly improvements */
html {
  -webkit-text-size-adjust: 100%;
}

body {
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
}

header {
  font-size: clamp(20px, 5vw, 28px);
  padding: 18px 14px;
}

.tabs {
  gap: 6px;
  padding: 10px;
}

.tabs button {
  flex: 1;
  min-width: 0;
  padding: 12px 8px;
  font-size: 14px;
}

textarea {
  width: 100%;
  max-width: 100%;
  min-height: 220px;
  font-size: 16px;
  line-height: 1.6;
  border-radius: 8px;
}

#run {
  width: calc(100% - 24px);
  min-height: 46px;
  margin: 12px;
}

iframe {
  display: block;
  width: calc(100% - 24px);
  margin: 0 12px 20px;
  border-radius: 8px;
}

@media (max-width: 480px) {
  header {
    padding: 16px 12px;
  }

  h3 {
    font-size: 17px;
  }

  .tabs button {
    font-size: 13px;
    padding: 12px 4px;
  }
}
  
</style>
</head>
<body>
<header>⚡ Neo Code Studio</header>
<h3>Code Editor</h3>
<div class="tabs">
<button class="active" onclick="showTab('html',this)">HTML</button>
<button onclick="showTab('css',this)">CSS</button>
<button onclick="showTab('js',this)">JavaScript</button>
</div>

<textarea id="html"><h1>Hello World!</h1>
<p>Welcome to Neo Code Studio.</p>
<button onclick="alert('It works!')">Test Button</button></textarea>

<textarea id="css" style="display:none">body {
  font-family: Arial;
  text-align: center;
  color: royalblue;
}
h1 { color: green; }</textarea>

<textarea id="js" style="display:none">console.log("Hello from JavaScript!");</textarea>

<button id="run" onclick="runCode()">▶ Run Code</button>
<h3>Live Preview</h3>
<iframe id="preview" sandbox="allow-scripts"></iframe>

<script>
let currentTab = "html";

function showTab(tab, button) {
  currentTab = tab;
  document.querySelectorAll("textarea").forEach(el => {
    el.style.display = el.id === tab ? "block" : "none";
  });
  document.querySelectorAll(".tabs button").forEach(el => {
    el.classList.remove("active");
  });
  button.classList.add("active");
}

function runCode() {
  const html = document.getElementById("html").value;
  const css = document.getElementById("css").value;
  const js = document.getElementById("js").value;
  document.getElementById("preview").srcdoc =
    html + "<style>" + css + "</style>" +
    "<script>" + js.replace(/<\/script/gi, "<\\/script") + "<\/script>";
}
runCode();
</script>
</body>
</html>
