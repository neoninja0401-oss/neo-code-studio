<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neo Code Studio</title>
<style>
body {
  margin: 0;
  background: #111827;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  padding: 20px;
  background: #1f2937;
  color: #60a5fa;
  font-size: 24px;
  font-weight: bold;
}
textarea {
  width: 100%;
  height: 220px;
  box-sizing: border-box;
  background: #0b1020;
  color: #86efac;
  padding: 15px;
  font-size: 16px;
}
button {
  margin: 12px;
  padding: 12px 20px;
  background: #16a34a;
  color: white;
  border: none;
  border-radius: 8px;
}
iframe {
  width: 95%;
  height: 220px;
  background: white;
  margin: 2%;
  border: none;
}
</style>
</head>
<body>
<header>⚡ Neo Code Studio</header>

<h3 style="padding-left:12px">HTML Editor</h3>

<textarea id="code"><h1>Hello World!</h1>
<p>My first code editor</p></textarea>

<button onclick="runCode()">▶ Run Code</button>

<h3 style="padding-left:12px">Live Preview</h3>
<iframe id="preview" sandbox="allow-scripts"></iframe>

<script>
function runCode() {
  const code = document.getElementById("code").value;
  document.getElementById("preview").srcdoc = code;
}
runCode();
</script>
</body>
</html>
